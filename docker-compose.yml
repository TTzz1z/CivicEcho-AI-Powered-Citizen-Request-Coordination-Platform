name: tingting-assistant

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-storage-environment: &storage-environment
  OBJECT_STORAGE_ENDPOINT: "${OBJECT_STORAGE_ENDPOINT:-minio:9000}"
  OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}"
  OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:-minioadmin}"
  OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-tingting-attachments}"
  OBJECT_STORAGE_SECURE: "${OBJECT_STORAGE_SECURE:-false}"
  OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:-}"
  OBJECT_STORAGE_TIMEOUT_SECONDS: "${OBJECT_STORAGE_TIMEOUT_SECONDS:-5}"
  KB_UPLOAD_BUCKET: "${KB_UPLOAD_BUCKET:-tingting-kb}"

services:
  frontend:
    <<: *service-defaults
    cpus: "${FRONTEND_CPU_LIMIT:-1.0}"
    mem_limit: "${FRONTEND_MEMORY_LIMIT:-256m}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "${VITE_DEMO_MODE:-true}"
    environment:
      BACKEND_UPSTREAM: "${FRONTEND_BACKEND_UPSTREAM:-http://backend:8000}"
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    <<: *service-defaults
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1024m}"
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tingting}"
      POSTGRES_USER: "${POSTGRES_USER:-tingting}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tingting} -d ${POSTGRES_DB:-tingting}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *service-defaults
    cpus: "${LEGACY_MINIO_CPU_LIMIT:-1.0}"
    mem_limit: "${LEGACY_MINIO_MEMORY_LIMIT:-512m}"
    # Public GHCR mirror of the original MinIO release image, pinned by digest.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio_data:/data
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r line <&3 && [[ \"$$line\" == *200* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *service-defaults
    cpus: "${BACKEND_CPU_LIMIT:-2.0}"
    mem_limit: "${BACKEND_MEMORY_LIMIT:-1536m}"
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *storage-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tingting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tingting}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-30}"
      APP_ENV: "${APP_ENV:-development}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-1048576}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}"
      LOGIN_RATE_LIMIT_ATTEMPTS: "${LOGIN_RATE_LIMIT_ATTEMPTS:-5}"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}"
      ALLOW_CITIZEN_SELF_REGISTER: "${ALLOW_CITIZEN_SELF_REGISTER:-true}"
      REGISTER_RATE_LIMIT_ATTEMPTS: "${REGISTER_RATE_LIMIT_ATTEMPTS:-10}"
      REGISTER_RATE_LIMIT_WINDOW_SECONDS: "${REGISTER_RATE_LIMIT_WINDOW_SECONDS:-300}"
      ANON_TICKET_RATE_LIMIT_ATTEMPTS: "${ANON_TICKET_RATE_LIMIT_ATTEMPTS:-15}"
      ANON_TICKET_RATE_LIMIT_WINDOW_SECONDS: "${ANON_TICKET_RATE_LIMIT_WINDOW_SECONDS:-300}"
      UPLOAD_RATE_LIMIT_ATTEMPTS: "${UPLOAD_RATE_LIMIT_ATTEMPTS:-30}"
      UPLOAD_RATE_LIMIT_WINDOW_SECONDS: "${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}"
      AI_RATE_LIMIT_ATTEMPTS: "${AI_RATE_LIMIT_ATTEMPTS:-30}"
      AI_RATE_LIMIT_WINDOW_SECONDS: "${AI_RATE_LIMIT_WINDOW_SECONDS:-60}"
      EXPORT_RATE_LIMIT_ATTEMPTS: "${EXPORT_RATE_LIMIT_ATTEMPTS:-10}"
      EXPORT_RATE_LIMIT_WINDOW_SECONDS: "${EXPORT_RATE_LIMIT_WINDOW_SECONDS:-60}"
      WORKER_DUE_SOON_HOURS: "${WORKER_DUE_SOON_HOURS:-4}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SERVICE_API_TOKEN: "${SERVICE_API_TOKEN:?Set SERVICE_API_TOKEN in .env}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-Asia/Shanghai}"
      ATTACHMENT_MAX_BYTES: "${ATTACHMENT_MAX_BYTES:-20971520}"
      ATTACHMENT_IMAGE_MAX_BYTES: "${ATTACHMENT_IMAGE_MAX_BYTES:-10485760}"
      MALWARE_SCAN_MODE: "${MALWARE_SCAN_MODE:-disabled}"
      MALWARE_SCAN_URL: "${MALWARE_SCAN_URL:-}"
      MALWARE_SCAN_TOKEN: "${MALWARE_SCAN_TOKEN:-}"
      MALWARE_SCAN_TIMEOUT_SECONDS: "${MALWARE_SCAN_TIMEOUT_SECONDS:-30}"
      MALWARE_SCAN_REQUIRE_CLEAN: "${MALWARE_SCAN_REQUIRE_CLEAN:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-rules}"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-phase6-rules-v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.deepseek.com}"
      AI_MODEL: "${AI_MODEL:-deepseek-chat}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-30}"
      AI_MAX_TOKENS: "${AI_MAX_TOKENS:-1024}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1024}"
      EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-30}"
      KB_CHUNK_SIZE: "${KB_CHUNK_SIZE:-500}"
      KB_CHUNK_OVERLAP: "${KB_CHUNK_OVERLAP:-100}"
      KB_RAG_TOP_K: "${KB_RAG_TOP_K:-5}"
      KB_RAG_MIN_LEXICAL_COVERAGE: "${KB_RAG_MIN_LEXICAL_COVERAGE:-0.22}"
      KB_RAG_MIN_VECTOR_SIMILARITY: "${KB_RAG_MIN_VECTOR_SIMILARITY:-0.62}"
      KB_ALLOW_DIRECT_PUBLISH: "${KB_ALLOW_DIRECT_PUBLISH:-true}"
      INTEGRATION_TIMEOUT_SECONDS: "${INTEGRATION_TIMEOUT_SECONDS:-10}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://localhost:8080/auth/oidc/callback}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      DIRECTORY_API_URL: "${DIRECTORY_API_URL:-}"
      DIRECTORY_API_TOKEN: "${DIRECTORY_API_TOKEN:-}"
      WORK_ORDER_PLATFORM: "${WORK_ORDER_PLATFORM:-disabled}"
      WORK_ORDER_API_URL: "${WORK_ORDER_API_URL:-}"
      WORK_ORDER_API_TOKEN: "${WORK_ORDER_API_TOKEN:-}"
      SMS_API_URL: "${SMS_API_URL:-}"
      SMS_API_TOKEN: "${SMS_API_TOKEN:-}"
      MAP_API_URL: "${MAP_API_URL:-}"
      MAP_API_TOKEN: "${MAP_API_TOKEN:-}"
      DIVISION_API_URL: "${DIVISION_API_URL:-}"
      DIVISION_API_TOKEN: "${DIVISION_API_TOKEN:-}"
      CENTRAL_LOG_ENDPOINT: "${CENTRAL_LOG_ENDPOINT:-}"
      CENTRAL_LOG_TOKEN: "${CENTRAL_LOG_TOKEN:-}"
      MONITORING_ENDPOINT: "${MONITORING_ENDPOINT:-}"
      MONITORING_TOKEN: "${MONITORING_TOKEN:-}"
      OTEL_SERVICE_NAME: civicecho-backend
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}"
    ports:
      # Local-only: /metrics and the API must not be LAN/WAN reachable by default.
      # In-cluster healthchecks use backend:8000; prod override clears host ports.
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *service-defaults
    cpus: "${WORKER_CPU_LIMIT:-1.0}"
    mem_limit: "${WORKER_MEMORY_LIMIT:-512m}"
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *storage-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tingting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tingting}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}"
      WORKER_ENABLED: "${WORKER_ENABLED:-true}"
      WORKER_SCAN_INTERVAL_SECONDS: "${WORKER_SCAN_INTERVAL_SECONDS:-60}"
      ANONYMOUS_RETENTION_DAYS: "${ANONYMOUS_RETENTION_DAYS:-30}"
      OTEL_SERVICE_NAME: civicecho-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}"
      WORKER_DUE_SOON_HOURS: "${WORKER_DUE_SOON_HOURS:-4}"
      WORKER_OUTBOX_RETENTION_DAYS: "${WORKER_OUTBOX_RETENTION_DAYS:-90}"
      WORKER_AI_RETENTION_DAYS: "${WORKER_AI_RETENTION_DAYS:-180}"
      WORKER_ORPHAN_GRACE_DAYS: "${WORKER_ORPHAN_GRACE_DAYS:-7}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-Asia/Shanghai}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
